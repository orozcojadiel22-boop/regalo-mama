<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mamá</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #14305a;
    --mid: #3c3a8f;
    --glow: #ff9bb8;
    --sun: #ffd37a;
    --card: #fff7ef;
    --ink: #3a2447;
    --serif: "Fraunces", Georgia, serif;
    --hand: "Caveat", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--serif); color: #fff;
    background: linear-gradient(180deg, var(--deep) 0%, var(--mid) 55%, #b9548f 100%);
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 24px;
    transition: opacity 1s, visibility 1s;
  }
  .off { opacity: 0; visibility: hidden; pointer-events: none; }

  h1 { font-family: var(--hand); font-weight: 600; font-size: clamp(3rem, 14vw, 5.2rem); line-height: 1; text-shadow: 0 0 30px rgba(255,155,184,.7); }
  .sub { margin: 14px 0 30px; font-style: italic; font-size: 1.15rem; opacity: .9; max-width: 22em; }

  button {
    font-family: var(--serif); font-size: 1.1rem; color: var(--ink);
    background: var(--sun); border: 0; border-radius: 999px;
    padding: 13px 32px; cursor: pointer;
    box-shadow: 0 8px 26px rgba(255, 211, 122, .35);
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { box-shadow: 0 8px 34px rgba(255, 211, 122, .6); }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .buddy { width: min(52vw, 230px); height: min(52vw, 230px); display: flex; align-items: center; justify-content: center; animation: bob 3.2s ease-in-out infinite; }
  .buddy img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 18px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.35)); }
  .buddy .fallback { font-size: 6rem; filter: drop-shadow(0 0 24px var(--glow)); }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }

  .bubble {
    position: relative; margin-top: 26px; width: min(90vw, 440px); min-height: 150px;
    background: var(--card); color: var(--ink); border-radius: 26px;
    padding: 26px 24px 22px; box-shadow: 0 22px 60px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 18px;
  }
  .bubble::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 24px; height: 24px;
    background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 4px;
  }
  .bubble p { font-family: var(--hand); font-size: clamp(1.5rem, 6vw, 1.95rem); line-height: 1.3; white-space: pre-wrap; transition: opacity .35s; }
  .bubble p.fade { opacity: 0; }
  .bubble button { font-size: 1rem; padding: 10px 26px; background: var(--ink); color: var(--card); box-shadow: none; }
  .bubble button:disabled { opacity: .85; cursor: default; }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(58,36,71,.2); transition: background .3s, transform .3s; }
  .dots i.on { background: var(--glow); transform: scale(1.35); }

  @media (prefers-reduced-motion: reduce) {
    .buddy { animation: none; }
    .screen, .bubble p { transition-duration: .01s; }
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<section id="intro" class="screen">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <button id="go" type="button">Toca para abrir tu regalo</button>
</section>

<section id="story" class="screen off">
  <div class="buddy" id="buddy">
    <img id="buddyImg" alt="" src="https://th.bing.com/th/id/OIP.sUbe_CTR0gQKGTbTNPOwjgHaHy?w=167&amp;h=210&amp;c=7&amp;r=0&amp;o=7&amp;pid=1.7&amp;rm=3">
  </div>
  <div class="bubble">
    <p id="msg"></p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button id="next" type="button">Siguiente</button>
  </div>
</section>

<script>
/* ===================== PERSONALIZA AQUÍ ===================== */
const CONFIG = {
  title: "Para mamá",
  subtitle: "Un regalo chiquito para la persona más grande de mi vida",
  from: "Tu hijo, que te quiere infinito",
  messages: [
    "Mamá, antes de que yo supiera caminar, tú ya sabías sostenerme.",
    "Cada vez que el mundo se puso difícil, tu abrazo fue mi casa.",
    "Me enseñaste que querer es quedarse, cuidar y volver a levantarse.",
    "La familia es eso que tú armaste con paciencia, risas y comida caliente.",
    "En nuestra ohana nadie se queda atrás ni se olvida. Eso lo aprendí de ti.",
    "Gracias por cada desvelo, cada consejo y cada \"avísame cuando llegues\".",
    "Hoy solo quería decirte, con todo mi corazón:\nERES MI LUGAR FAVORITO EN EL MUNDO."
  ]
};
/* ============================================================ */

(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var idx = 0, burst = false, triedLocal = false;

  $("title").textContent = CONFIG.title;
  $("subtitle").textContent = CONFIG.subtitle;
  document.title = CONFIG.title;

  // Si la imagen de internet falla, prueba con stitch.png; si no, muestra un corazón
  $("buddyImg").addEventListener("error", function () {
    if (!triedLocal) { triedLocal = true; this.src = "stitch.png"; return; }
    var f = document.createElement("div");
    f.className = "fallback"; f.textContent = "\uD83D\uDC99";
    this.replaceWith(f);
  });

  var dots = $("dots");
  CONFIG.messages.forEach(function () { dots.appendChild(document.createElement("i")); });

  function show(i) {
    var p = $("msg");
    p.classList.add("fade");
    setTimeout(function () {
      p.textContent = CONFIG.messages[i];
      p.classList.remove("fade");
      Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle("on", k === i); });
      $("next").textContent = i === CONFIG.messages.length - 1 ? "Con amor \u2665" : "Siguiente";
    }, reduce ? 0 : 320);
  }

  $("go").addEventListener("click", function () {
    $("intro").classList.add("off");
    $("story").classList.remove("off");
    show(0);
  });

  $("next").addEventListener("click", function () {
    if (idx < CONFIG.messages.length - 1) { idx++; show(idx); }
    else if (!burst) {
      burst = true; startBurst();
      $("next").textContent = CONFIG.from;
      $("next").disabled = true;
    }
  });

  /* ---------- Canvas: pétalos, estrellas y corazones ---------- */
  var cv = $("fx"), ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1, petals = [], hearts = [], stars = [];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = [];
    for (var i = 0; i < Math.round(W * H / 9000); i++) stars.push({ x: rnd(0, W), y: rnd(0, H * 0.6), r: rnd(.4, 1.3), p: rnd(0, 6.28) });
    petals = [];
    var n = reduce ? 0 : Math.min(34, Math.round(W / 14));
    for (var j = 0; j < n; j++) petals.push(newPetal(true));
  }

  function newPetal(anywhere) {
    return {
      x: rnd(0, W), y: anywhere ? rnd(-H, H) : -20, s: rnd(5, 11),
      vy: rnd(.5, 1.3), sway: rnd(.5, 1.6), ph: rnd(0, 6.28),
      rot: rnd(0, 6.28), vr: rnd(-.02, .02),
      c: ["#ff9bb8", "#ffb3c7", "#ff7aa2", "#ffd0dc"][Math.floor(rnd(0, 4))]
    };
  }

  function startBurst() {
    var n = reduce ? 14 : 46;
    for (var i = 0; i < n; i++) {
      hearts.push({ x: W / 2 + rnd(-30, 30), y: H * 0.55, vx: rnd(-3, 3), vy: rnd(-7, -2.5), s: rnd(16, 34), a: 1, c: ["#ff9bb8", "#ffd37a", "#ff7aa2", "#fff"][Math.floor(rnd(0, 4))] });
    }
  }

  function loop(t) {
    ctx.clearRect(0, 0, W, H);
    var ts = t / 1000, i;

    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = reduce ? .6 : .35 + .35 * Math.sin(ts * 1.5 + s.p);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.vy; p.x += Math.sin(ts * p.sway + p.ph) * .6; p.rot += p.vr;
      if (p.y > H + 20) petals[i] = newPetal(false);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = .8; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      h.x += h.vx; h.y += h.vy; h.vy += .08; h.a -= .004;
      if (h.a <= 0) { hearts.splice(i, 1); continue; }
      ctx.globalAlpha = h.a; ctx.fillStyle = h.c;
      ctx.font = h.s + "px serif";
      ctx.fillText("\u2665", h.x, h.y);
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
  }

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
